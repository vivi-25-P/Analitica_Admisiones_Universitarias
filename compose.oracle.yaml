name: admisiones_oracle
services:
  oracle:
    image: container-registry.oracle.com/database/free:23.26.0.0-lite
    restart: unless-stopped
    environment:
      ORACLE_PWD: ${ORACLE_PASSWORD:?Ejecuta scripts/preparar_oracle.py}
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_taller2_data:/opt/oracle/oradata
    shm_size: 1gb
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
volumes:
  oracle_taller2_data:
